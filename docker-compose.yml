version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: twingle-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=twingle

  redis:
    image: redis:7-alpine
    container_name: twingle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twingle-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/twingle
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=7d
      - CLIENT_URL=${CLIENT_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: twingle-client
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${CLIENT_URL}
    depends_on:
      - server

volumes:
  mongodb_data: